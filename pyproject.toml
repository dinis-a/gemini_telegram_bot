[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-telegram-bot"
version = "1.0.0"
description = "A Telegram bot powered by Google Gemini AI for intelligent conversations and code analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Dinis Akhmetshin"}
]
keywords = ["telegram", "bot", "gemini", "ai", "chatbot", "google"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

requires-python = ">=3.12"
dependencies = [
    "aiogram==3.28.2",
    "google-generativeai==0.8.6",
    "python-dotenv==1.1.1",
    "chatgpt-md-converter==0.3.12",
    "markdown==3.10.2",
    "telegram-text-splitter==0.1.1",
    "telegramify-markdown==1.1.5",
    "tiktoken==0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "flake8>=7.0",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.8",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = ["__pycache__", ".venv", "build", "dist"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
