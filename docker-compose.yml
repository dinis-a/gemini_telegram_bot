services:
  gemini_bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: ghcr.io/dinis-a/gemini_telegram_bot:latest
    container_name: gemini_bot
    env_file:
      - .env
    volumes:
      - app-logs:/app/logs
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    stop_grace_period: 10s

volumes:
  app-logs:
